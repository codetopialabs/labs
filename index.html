<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0b0c" />
    <script>
      // Apply a saved theme before the page draws, so there is no flash.
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff')
        }
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Codetopia Labs is the research and engineering division of Codetopia, based in Ghana." />
    <title>Codetopia Labs</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Codetopia Labs" />
    <meta property="og:title" content="Codetopia Labs" />
    <meta property="og:description" content="The research and engineering division of Codetopia, built in Ghana." />
    <meta property="og:url" content="https://labs.codetopia.org/" />
    <meta property="og:image" content="https://labs.codetopia.org/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Codetopia Labs logo and a solved maze on a dark background" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet" />
    <!-- Space Grotesk only draws the LABS wordmark, so only those letters load. -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&text=LABS&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
